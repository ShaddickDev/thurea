[workspace]
resolver = "2"
members = ["crates/thurea-core", "crates/thurea-agent", "crates/thurea-android", "crates/thurea-tray"]

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
