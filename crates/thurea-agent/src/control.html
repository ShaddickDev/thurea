<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Thurea · Family</title>
<style>
  :root {
    --bg: #f4f5f8; --surface: #ffffff; --surface-2: #f0f2f6; --line: #e3e6ec; --text: #161a22; --muted: #5d6573;
    --accent: #2563eb; --accent-soft: #e5edff; --accent-ink: #ffffff;
    --good: #15803d; --good-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7; --bad: #b91c1c; --bad-soft: #fee2e2;
    --shadow: 0 1px 2px #0000000d, 0 4px 16px #0000000a; --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --surface: #1b1e26; --surface-2: #242833; --line: #2c303c; --text: #eceef3; --muted: #9ba2ae;
      --accent: #8ac8ff; --accent-soft: #1f3247; --accent-ink: #0b1b2b;
      --good: #4ade80; --good-soft: #15301f; --warn: #fbbf24; --warn-soft: #3a2c10; --bad: #f87171; --bad-soft: #3b1d21;
      --shadow: 0 1px 2px #0006, 0 8px 24px #0004;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", "Helvetica Neue", Arial, sans-serif; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

  /* Top bar and navigation */
  .top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; padding: 16px 0 10px; }
  .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .mark svg { width: 20px; height: 20px; stroke-width: 2; }
  .brand h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
  .brand .sub { color: var(--muted); font-size: 13px; line-height: 1.3; }
  .brand .grow { flex: 1; min-width: 0; }
  .conn { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--good-soft); color: var(--good); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .conn.off { background: var(--warn-soft); color: var(--warn); }
  nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
  nav::-webkit-scrollbar { display: none; }
  nav a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; padding: 7px 14px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
  nav a:hover { background: var(--surface-2); color: var(--text); }
  nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .badge { background: var(--bad); color: #fff; font-size: 11px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-grid; place-items: center; }

  main.wrap { padding-top: 26px; padding-bottom: 70px; }
  .kid .split button { padding: 6px 11px; }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 30px 4px 10px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  h2:first-child { margin-top: 4px; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); }
  .pad { padding: 18px 20px; }
  .list > .row + .row { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; min-height: 64px; }
  .row.indent { padding-left: 56px; }
  .row .main { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; overflow-wrap: anywhere; }
  .row .sub, .muted { color: var(--muted); font-size: 13.5px; }
  .ico { width: 38px; height: 38px; border-radius: 12px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; flex: none; }
  .ico.accent { background: var(--accent-soft); color: var(--accent); }
  .ico.warn { background: var(--warn-soft); color: var(--warn); }
  .ico.good { background: var(--good-soft); color: var(--good); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  @media (max-width: 620px) { .row { flex-wrap: wrap; } .row .actions { width: 100%; justify-content: flex-start; padding-left: 52px; } .row.indent .actions { padding-left: 0; } }

  button, .btn { font: inherit; font-weight: 600; font-size: 13.5px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; background: var(--surface); color: var(--text); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--surface-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  button.danger { color: var(--bad); }
  button.danger:hover:not(:disabled) { background: var(--bad-soft); }
  button.ghost { border-color: transparent; background: transparent; color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  button svg { width: 16px; height: 16px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.busy::after { content: ""; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  input[type=text], input[type=number], input[type=time], select {
    font: inherit; font-size: 14px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; min-width: 0; }
  select { padding-right: 28px; cursor: pointer; }
  input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .field { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .field input { flex: 1 1 200px; }
  label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }

  .switch { position: relative; width: 46px; height: 28px; flex: none; display: inline-block; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0003; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch input:disabled + span { opacity: .5; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; }
  .kid-head > div { min-width: 0; }
  .chip { white-space: nowrap; display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
  .kid { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .kid-head { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: #fff; flex: none; }
  .avatar.big { width: 56px; height: 56px; font-size: 22px; }
  .kid-name { font-weight: 700; font-size: 17px; }
  .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
  .bar.warn > i { background: var(--warn); } .bar.over > i { background: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .big-num { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .hero { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .hero .grow { flex: 1; min-width: 220px; }
  .code { font: 700 30px/1.2 ui-monospace, "SF Mono", "Cascadia Mono", "DejaVu Sans Mono", Menlo, monospace; letter-spacing: .1em; color: var(--accent); }
  .code.small { font-size: 16px; letter-spacing: .06em; }
  code { font: 13px ui-monospace, "SF Mono", "Cascadia Mono", "DejaVu Sans Mono", Menlo, monospace; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }
  .empty { text-align: center; padding: 34px 24px; }
  .empty .ico { margin: 0 auto 12px; width: 52px; height: 52px; border-radius: 16px; }
  .empty .ico svg { width: 26px; height: 26px; }
  .empty h3 { margin: 0 0 6px; font-size: 18px; }
  .empty p { margin: 0 auto; max-width: 460px; }
  .setup { max-width: 560px; margin: 40px auto; }
  .setup h3 { font-size: 22px; margin: 4px 0 8px; letter-spacing: -.01em; }
  .steps { margin: 14px 0 0; padding-left: 20px; color: var(--muted); }
  .steps li { margin: 6px 0; }
  .banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 14px; margin-bottom: 16px; }
  .split { display: flex; gap: 8px; flex-wrap: wrap; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    background: #1f2430; color: #f2f4f8; padding: 12px 18px; border-radius: 14px; max-width: min(560px, 92vw); box-shadow: 0 10px 30px #0005; z-index: 20; font-size: 14px; display: flex; gap: 10px; align-items: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #toast.err { background: #5b1f26; }
  dialog { border: 0; border-radius: 20px; padding: 0; background: var(--surface); color: var(--text); box-shadow: 0 20px 60px #0006; width: min(440px, 92vw); }
  dialog::backdrop { background: #0008; }
  dialog .pad { padding: 22px 22px 18px; }
  dialog h3 { margin: 0 0 6px; font-size: 18px; }
  dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  footer { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 34px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div class="grow"><h1>Thurea Family</h1><div class="sub" id="household">Parents' control centre</div></div>
      <span class="conn" id="conn" role="status">Connected</span>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"><div class="card pad muted">Loading…</div></main>
<div id="toast" role="status" aria-live="assertive"></div>
<dialog id="dlg"></dialog>
<script>
"use strict";
const T = "{{TOKEN}}";
let state = null, lastJson = "", fails = 0, busy = 0, renderedAt = 0;

// ── Small helpers ──
const ICONS = {
  inbox: '<path d="M4 13l2-8h12l2 8"/><path d="M4 13v6h16v-6h-5l-1 2h-4l-1-2H4z"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  pause: '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
  play: '<path d="M7 5l12 7-12 7V5z"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  chat: '<path d="M4 5h16v11H9l-5 4V5z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  box: '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
  usb: '<path d="M12 3v14"/><circle cx="12" cy="19" r="2"/><path d="M8 7l4-4 4 4"/><path d="M7 11v2l5 3 5-3v-2"/>',
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  laptop: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.5-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .8 3.2 2.6 3.6 5.2"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3z"/>',
  hand: '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-6.5a1.5 1.5 0 0 1 3 0V11m0-5a1.5 1.5 0 0 1 3 0v7c0 4-2.5 8-7 8-3 0-4.5-1.5-6-4l-2-3.5a1.5 1.5 0 0 1 2.5-1.6L8 13"/>',
  hourglass: '<path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/>',
  shield: '<path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/>',
  alert: '<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  arrow: '<path d="M9 6l6 6-6 6"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  folder: '<path d="M3 6h6l2 2h10v11H3V6z"/>',
};
function icon(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
  s.innerHTML = ICONS[name] || ICONS.info; // constant markup only
  return s;
}
// h("div.card.pad", {attrs}, children…): text children are always text, never HTML.
function h(sel, attrs, ...kids) {
  const [tag, ...cls] = sel.split(".");
  const el = document.createElement(tag || "div");
  if (cls.length) el.className = cls.join(" ");
  if (attrs && (typeof attrs !== "object" || attrs instanceof Node || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
const ico = (name, tone) => h("div.ico" + (tone ? "." + tone : ""), icon(name));
const dur = (m) => { m = Math.max(0, Math.round(m || 0)); return m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) + " min" : ""}` : `${m} min`; };
const hhmm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const parseHHMM = (s) => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ""); return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : null; };
const now = () => (state && state.now) || Date.now() / 1000;
const ago = (t) => { const m = Math.round((now() - t) / 60); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const timeOf = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const today = () => (state && state.day) || new Date().toLocaleDateString("sv");
const hue = (s) => { let x = 0; for (const c of s) x = (x * 31 + c.codePointAt(0)) % 360; return x; };
const avatar = (name, big) => h("div.avatar" + (big ? ".big" : ""), { style: `background:hsl(${hue(name)} 55% 48%)`, "aria-hidden": "true" }, [...name][0].toUpperCase());
const PLATFORM = { android: "Android phone", windows: "Windows PC", linux: "Linux computer", macos: "Mac", offline: "Not seen recently" };
const isComputer = (p) => ["windows", "linux", "macos"].includes(p);

function toast(msg, err) {
  const t = document.getElementById("toast");
  t.replaceChildren(icon(err ? "alert" : "check"), h("span", msg || (err ? "That didn't work" : "Done")));
  t.className = "show" + (err ? " err" : "");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.className = err ? "err" : "", err ? 8000 : 4000);
}

// ── Talking to Thurea ──
async function load(force) {
  if (busy && !force) return;
  try {
    const r = await fetch("/api/state?t=" + T, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const text = await r.text();
    fails = 0; setConn(true);
    const s = JSON.parse(text);
    const key = JSON.stringify({ ...s, now: 0 });
    state = s;
    // The Downloads page keeps itself up to date (and what was pasted there stays).
    if (!force && route() === "downloads") return;
    // Never redraw under the parent's hands: while they type, pick or read a dialog.
    if (!force && (editing() || document.getElementById("dlg").open)) return;
    if (force || key !== lastJson || Date.now() - renderedAt > 60000) { lastJson = key; render(); }
  } catch {
    fails++; setConn(false);
  }
}
function editing() {
  const a = document.activeElement;
  return a && a.closest && a.closest("#app") && (["INPUT", "SELECT", "TEXTAREA"].includes(a.tagName) && a.type !== "checkbox");
}
function setConn(ok) {
  const c = document.getElementById("conn");
  c.className = "conn" + (ok ? "" : " off");
  c.textContent = ok ? "Connected" : fails > 3 ? "Closed — open Family from Thurea again" : "Reconnecting…";
}

// Sends one change. The button that asked shows it is working; the page redraws after.
async function act(body, btn) {
  busy++;
  const els = btn ? [].concat(btn) : [];
  els.forEach(b => { b.disabled = true; if (b.tagName === "BUTTON") b.classList.add("busy"); });
  let v = { ok: false, msg: "" };
  try {
    const r = await fetch("/api/do?t=" + T, { method: "POST", headers: { "Content-Type": "application/json", "X-Thurea": "1" }, body: JSON.stringify(body) });
    v = await r.json();
  } catch (e) { v = { ok: false, msg: "Couldn't reach Thurea on this computer. Open Family from Thurea again." }; }
  busy--;
  els.forEach(b => { b.disabled = false; b.classList.remove("busy"); });
  if (body.action !== "code") toast(friendly(v), !v.ok);
  await load(true);
  return v;
}
function friendly(v) {
  if (!v.ok) return v.msg ? v.msg.charAt(0).toUpperCase() + v.msg.slice(1) : "That didn't work";
  return /^Done/.test(v.msg || "") ? "Saved. Your family's devices follow within a minute." : v.msg;
}

function btn(label, opts, on) {
  if (typeof opts === "function") { on = opts; opts = {}; }
  const b = h("button" + (opts.cls ? "." + opts.cls.split(" ").join(".") : ""), { type: "button", "aria-label": opts.aria }, opts.icon ? icon(opts.icon) : null, label);
  b.addEventListener("click", () => on(b));
  return b;
}
function sw(checked, label, on) {
  const input = h("input", { type: "checkbox", role: "switch", "aria-label": label });
  input.checked = !!checked;
  input.addEventListener("change", async () => { const want = input.checked; const v = await on(want, input); if (v && !v.ok) input.checked = !want; });
  return h("label.switch", input, h("span"));
}

function childStatus(c) {
  const st = c.screen || {}, t = c.today || { used: 0 }, nowS = now();

  if (st.paused_until && st.paused_until > nowS) return { tone: "warn", text: `Paused until ${timeOf(st.paused_until)}`, paused: true, allowed };
  if (inBed) return { tone: "accent", text: `Bedtime until ${hhmm(bed.end)}`, allowed };
  if (allowed && t.used >= allowed) return { tone: "bad", text: "Today's time is used up", allowed };

// Every device the household knows, merged from the family's list and who is online.
function deviceList(s) {
  const map = new Map();
  const entry = (id) => (s.devices || {})[id] || {};
  const add = (id, name, platform, online, seen, accounts) => {
    const e = entry(id);
    const owners = { ...(e.accounts || {}) };
    for (const u of accounts || []) if (!(u.toLowerCase() in owners)) owners[u.toLowerCase()] = null;
    map.set(id, { id, name: name || e.name || id, platform: platform || "offline", online, seen, child: e.role === "child" ? e.child : null, accountOwners: owners, here: id === s.this_device });
  };
  if (s.this_device) add(s.this_device, `${s.computer || "This computer"}`, s.my_platform, true, now(), s.my_accounts);
  for (const p of s.peers || []) if (!map.has(p.id)) add(p.id, p.name, p.platform, p.last_seen ? now() - p.last_seen < 300 : true, p.last_seen, p.accounts);
  for (const [id, d] of Object.entries(s.devices || {})) if (!map.has(id)) add(id, d.name, "offline", false, null, []);
  return [...map.values()];
}

    if (d.child) acts.push(btn("Make it an adult's", async b => { if (await confirmDo(`Make ${d.name} an adult's device?`, `${d.child}'s rules stop applying to it.`, "Make it an adult's")) act({ action: "role", device: d.id, role: "adult" }, b); }));
    else if (!isComputer(d.platform)) acts.push(btn("A child's device…", async b => {
      const c = await askText(`Whose is ${d.name}?`, "Their rules and screen time apply to the whole device. Use the same name on all of a child's devices.", "Child's name", "", "Make it theirs", kids);
      if (c) act({ action: "role", device: d.id, role: "child", child: c }, b);
    }));
    list.append(row(isComputer(d.platform) ? "laptop" : "phone", h("span", d.name, " ", h("span.chip." + (d.online ? "good" : "x"), status)), `${kind} · ${PLATFORM[d.platform] || d.platform}`, acts, { tone: d.child ? "accent" : "" }));
    for (const [u, owner] of Object.entries(d.accountOwners)) {
      const aa = owner
        ? btn("Make it an adult's", async b => { if (await confirmDo(`Make ${u} an adult's account?`, `${owner}'s rules stop applying to this account.`, "Make it an adult's")) act({ action: "account", device: d.id, user: u, child: "" }, b); })
        : btn("A child's account…", async b => {
          const c = await askText(`Whose account is ${u}?`, "Programs, websites and screen time in this account then follow the child's rules. It must be a standard account, not an administrator.", "Child's name", "", "Make it theirs", kids);
          if (c) act({ action: "account", device: d.id, user: u, child: c }, b);
        });
      list.append(row(null, h("span", h("span.chip", "account"), " ", u), owner ? `${owner}'s account — follows ${owner}'s rules` : "An adult's account", aa, { indent: true }));
    }
  }
  out.push(list);
  out.push(h("p.muted", { style: "margin:12px 6px 0" }, "Phones: set up a child's phone from Thurea → Set up a phone, then mark it here. Shared computers: give each child a standard account, then mark that account."));
  return out;
}

function settingsPage(s) {
  const out = [h("h2", "Parents")];
  out.push(h("div.card.list",
    (s.parents || []).map(p => row("user", p, p === s.my_name ? "You" : "Parent", null, { tone: p === s.my_name ? "accent" : "" })),
    row("plus", "Add another parent", h("span", "On their phone: Thurea → Family → I'm a parent too. On their computer: Family → I'm a parent too. Approve the request here only if both show the same code."), null),
    s.my_code ? row("key", "Your parent code", h("span", "Your key on this computer: ", h("b.code.small", s.my_code)), null) : null));

  out.push(h("h2", "Away from home"));
  const input = h("input", { type: "text", placeholder: "relay.example.org:47830", "aria-label": "Relay address", value: s.relay || "" });
  out.push(h("div.card.pad", h("div", { style: "font-weight:600" }, "Reach your family from anywhere"),
    h("p.muted", { style: "margin:6px 0 0" }, "Your own relay passes the family's encrypted messages between devices on different networks: a child's phone on mobile data, you at work. Run ", h("code", "thurea relay"), " on a server with a public UDP port (47830). It only ever sees scrambled data."),
    h("div.field", input, btn("Save", { cls: "primary" }, b => act({ action: "relay", addr: input.value.trim() }, b)),
      s.relay ? btn("Turn off", { cls: "danger" }, async b => { if (await confirmDo("Turn the relay off?", "Devices then only reach each other on the same network.", "Turn off")) act({ action: "relay", addr: "" }, b); }) : null)));

  out.push(h("h2", "From a terminal"));
  out.push(h("div.card.pad", h("p.muted", { style: "margin:0" }, "Everything here also works with ", h("code", "thurea family"), " (see ", h("code", "thurea help"), "), for example ",
    h("code", "thurea family screen NAME daily 90"), " or ", h("code", "thurea family approve ID 30"), "."),
    h("p.muted", { style: "margin:8px 0 0" }, `Family policy version ${s.version || 0}.`)));
  return out;
}

// ── Downloads: the same list as the browser extension's (Thurea → Download in any browser) ──
let dlJobs = [], dlFolder = "", dlTimer = 0;
async function video(body, b) {
  if (b) { b.disabled = true; b.classList.add("busy"); }
  let v;
  try {
    const r = await fetch("/api/video?t=" + T, { method: "POST", headers: { "Content-Type": "application/json", "X-Thurea": "1" }, body: JSON.stringify(body) });
    v = await r.json();
  } catch { v = { error: "Couldn't reach Thurea on this computer. Open Thurea again." }; }
  if (b) { b.disabled = false; b.classList.remove("busy"); }
  if (v.error) toast(v.error, true);
  return v;
}
async function loadDownloads() {
  try {
    const r = await fetch("/api/downloads?t=" + T, { cache: "no-store" });
    const v = await r.json();
    dlJobs = v.jobs || []; dlFolder = v.folder || "";
  } catch { return; }
  const box = document.getElementById("dl-jobs");
  if (box) box.replaceChildren(...jobRows());
  const f = document.getElementById("dl-folder");
  if (f) f.textContent = dlFolder;
}
const RUNNING = (j) => !["done", "failed", "cancelled"].includes(j.state);
function jobRows() {
  if (!dlJobs.length) return [h("div.pad.muted", "No downloads yet. Start one here, or with Thurea → Download in your browser.")];
  return dlJobs.map(j => {
    const q = j.quality === "audio" ? "Audio" : j.quality === "best" ? "Best" : j.quality + "p";
    const name = j.title || j.url;
    let sub;
    if (j.state === "done") sub = "Saved: " + (j.name || String(j.file || "").split(/[\\/]/).pop());
    else if (j.state === "failed") sub = "Failed: " + (j.error || "unknown error");
    else if (j.state === "cancelled") sub = "Cancelled";
    else if (j.state === "converting") sub = "Joining video and sound…";
    else if (j.state === "preparing") sub = "Getting the downloader ready (the first time takes a minute)…";
    else if (j.state === "queued") sub = "Starting…";
    else sub = `${(j.percent || 0).toFixed(1)}%` + (j.part > 1 && !j.playlist ? " (sound)" : "") + (j.speed ? ` · ${j.speed}` : "") + (j.eta ? ` · ${j.eta} left` : "") + (j.item ? ` · item ${j.item}` : "");
    const acts = [];
    if (RUNNING(j)) acts.push(btn("Cancel", { cls: "danger" }, b => video({ type: "cancel", job: j.id }, b).then(loadDownloads)));
    if (j.state === "done") acts.push(btn("Show", { icon: "folder" }, b => video({ type: "reveal", job: j.id }, b)));
    if (!RUNNING(j)) acts.push(btn("Remove", { aria: "Remove from the list" }, b => video({ type: "forget", job: j.id }, b).then(loadDownloads)));
    const r = row(j.state === "failed" || j.state === "cancelled" ? "alert" : j.state === "done" ? "check" : "download",
      h("span", name, " ", h("span.chip", q), j.from === "browser" ? h("span.chip", "from the browser") : null), sub, acts,
      { tone: j.state === "done" ? "good" : j.state === "failed" ? "warn" : "accent" });
    if (RUNNING(j)) r.querySelector(".main").append(h("div", { style: "height:4px;border-radius:2px;background:rgba(127,127,127,.25);margin-top:6px" },
      h("div", { style: `height:100%;border-radius:2px;background:currentColor;opacity:.6;width:${Math.min(100, j.percent || 0)}%` })));
    return r;
  });
}
function downloadsPage() {
  const url = h("input", { type: "url", placeholder: "Paste a video's address (YouTube, Vimeo, almost any site)", "aria-label": "Video address", style: "flex:1;min-width:0" });
  const picks = h("div", { style: "display:flex;flex-wrap:wrap;gap:8px;margin-top:12px" });
  const check = btn("Check", { cls: "primary", icon: "download" }, async b => {
    const u = url.value.trim();
    if (!/^https?:\/\//.test(u)) { toast("Paste the address of the page with the video", true); return; }
    picks.replaceChildren(h("span.muted", "Checking what this video offers…"));
    const info = await video({ type: "formats", url: u }, b);
    if (info.error) { picks.replaceChildren(h("span.muted", info.error)); return; }
    const title = info.title || u;
    const start = (quality) => async (b2) => {
      const v = await video({ type: "download", url: u, quality, title }, b2);
      if (v.job) { toast("Downloading: " + title); url.value = ""; picks.replaceChildren(); loadDownloads(); }
    };
    picks.replaceChildren(h("div", { style: "width:100%;font-weight:600" }, title),
      ...(info.formats || []).map((f, i) => btn(f.label, { cls: i === 0 ? "primary" : "" }, start(String(f.height)))),
      btn("Audio (MP3)", start("audio")));
  });
  url.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check.click(); } });
  clearInterval(dlTimer);
  dlTimer = setInterval(() => { if (route() === "downloads") loadDownloads(); else clearInterval(dlTimer); }, 1500);
  setTimeout(loadDownloads, 0);
  return [h("h2", "Download a video"),
    h("div.card.pad", h("div.field", { style: "display:flex;gap:8px" }, url, check), picks,
      h("p.muted", { style: "margin:12px 0 0" }, "Every resolution the video comes in, up to 8K, or just the sound. Saved in ", h("b", { id: "dl-folder" }, dlFolder || "your Downloads folder"), ". Sites Thurea blocks can't be downloaded from.")),
    h("h2", "Downloads"),
    h("div.card.list", { id: "dl-jobs" }, jobRows()),
    h("p.muted", { style: "margin:12px 6px 0" }, "The same list as Thurea's Download menu in Chrome, Edge, Brave, Firefox and the rest: start a download in one and follow it in the other.")];
}

// ── Omarchy: the page wears the desktop's theme, and changes with it ──
// /api/theme is the current Omarchy theme's colors.toml ({} elsewhere: the page's own light and
// dark colours stay). Omarchy 3 themes have no named red / green / yellow: their color1-3 are.
let themeStamp = null;
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const x = hex(a), y = hex(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); }
function lum(c) { const [r, g, b] = hex(c).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; }
function contrast(a, b) { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); }
function applyTheme(t) {
  const c = t && t.colors, root = document.documentElement.style;
  const names = ["--bg", "--surface", "--surface-2", "--line", "--text", "--muted", "--accent", "--accent-soft", "--accent-ink", "--good", "--good-soft", "--warn", "--warn-soft", "--bad", "--bad-soft"];
  if (!c || !c.background || !c.foreground) { names.forEach(n => root.removeProperty(n)); delete document.documentElement.dataset.omarchy; return; }
  const bg = c.background, fg = c.bright_foreground || c.foreground;
  const light = c.mode ? c.mode === "light" : (t.light || lum(bg) > .45);
  const accent = c.accent || c.blue || c.color4 || "#7aa2f7";
  const pick = (...k) => k.map(x => c[x]).find(Boolean);
  const good = pick("green", "color2") || "#4ade80", warn = pick("yellow", "color3") || "#fbbf24", bad = pick("red", "color1") || "#f87171";
  const soft = x => mix(bg, x, light ? .14 : .2);
  // Secondary text: the theme's own dim colour if it reads well (4.5:1 on a card), else the
  // text colour faded only as far as stays readable.
  const surface = c.lighter_background || mix(bg, fg, light ? .03 : .05);
  let muted = c.dark_foreground;
  if (!muted || contrast(muted, surface) < 4.5) {
    for (let t = .45; t >= 0; t -= .05) { muted = mix(fg, bg, t); if (contrast(muted, surface) >= 4.5) break; }
  }
  const v = {
    "--bg": bg,
    "--surface": surface,
    "--surface-2": mix(bg, fg, light ? .07 : .1),
    "--line": mix(bg, fg, light ? .14 : .16),
    "--text": fg,
    "--muted": muted,
    "--accent": accent, "--accent-soft": soft(accent),
    "--accent-ink": contrast(accent, "#ffffff") >= contrast(accent, bg) ? "#ffffff" : bg,
    "--good": good, "--good-soft": soft(good), "--warn": warn, "--warn-soft": soft(warn), "--bad": bad, "--bad-soft": soft(bad),
  };
  for (const n in v) root.setProperty(n, v[n]);
  document.documentElement.style.colorScheme = light ? "light" : "dark";
  document.documentElement.dataset.omarchy = t.name || "theme";
}
async function loadTheme() {
  try {
    const r = await fetch("/api/theme?t=" + T, { cache: "no-store" });
    if (!r.ok) return;
    const t = await r.json();
    const stamp = JSON.stringify([t.stamp, t.name]);
    if (stamp !== themeStamp) { themeStamp = stamp; applyTheme(t); }
  } catch (e) { /* the page's own colours stay */ }
}

loadTheme();
load(true);
setInterval(() => load(false), 4000);
setInterval(loadTheme, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { load(false); loadTheme(); } });
</script>
